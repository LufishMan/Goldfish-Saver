name: Build

# 手動觸發，或推送 v* 標籤（例如 v1.0.5）時自動建置
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 需要寫入權限，才能由 GITHUB_TOKEN 建立 / 更新 Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build editor bundle (TipTap)
        run: npm run build:editor

      - name: Package (${{ matrix.target }})
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldFish-Saver-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore

      # 推送 v* 標籤時，將安裝檔發佈到對應的 GitHub Release
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
          fail_on_unmatched_files: false
